<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sample form</title>

    <!-- Internal CSS -->
    <style>
       body
input:focus {
  border: 2px solid #007bff;
  outline: none;

}


input:invalid {
  border-color: #ff4d4d;
}


button:hover {
  background-color: #5ba507;
  cursor: pointer;

}


button:active { 
    transform: scale(1);
}

input::placeholder {
  color: #aaa;
  font-style: italic;
}

.field label::before {
  content: "* ";
  color: red;
  font-weight: bold;
}

button::after {
  content: " →" ;
  font-weight:bolder;
  color: rgb(16, 109, 62);
}

    </style>
</head>

<body>
<form class="contact-form">
  <div class="field">
    <label for="name">Name:</label>
    <input type="text" id="name" placeholder="Your Name" required>
  </div>
  
  <div class="field">
    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="example@mail.com" required>
  </div>

  <button type="submit">Send Message</button>
</form>

</body>
</html>
